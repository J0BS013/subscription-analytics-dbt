name: dbt CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      # Seeds are the local demo's raw inputs. Load them before building
      # source-based staging models so CI is independent of prior state.
      - run: dbt seed --project-dir streaming_project --profiles-dir . --no-use-colors
      - run: dbt build --project-dir streaming_project --profiles-dir . --no-use-colors --exclude resource_type:seed
